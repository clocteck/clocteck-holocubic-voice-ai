<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Voice AI 信息</title>
  <style>
    :root{--bg:#f6f8fb;--surface:#fff;--text:#0f172a;--muted:#64748b;--line:#d9e2ef;--accent:#0f766e;--soft:#ecfeff}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    main{width:min(860px,100%);margin:0 auto;padding:14px}.top,.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
    .top{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}.icon{width:64px;height:64px;border-radius:14px}.kicker{margin:0 0 4px;color:var(--accent);font-weight:800;font-size:13px}
    h1{margin:0;font-size:30px;line-height:1.1}.summary{margin:7px 0 0;color:var(--muted);line-height:1.45}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:12px}
    h2{margin:0 0 10px;font-size:17px}.list{list-style:none;margin:0;padding:0;display:grid;gap:9px}.list li{display:grid;grid-template-columns:28px 1fr;gap:9px}
    .badge{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--accent);font-weight:850}.muted{color:var(--muted);font-size:13px}
    a.button{display:inline-flex;min-height:44px;align-items:center;justify-content:center;margin-top:8px;padding:0 14px;border-radius:6px;background:var(--accent);color:#fff;text-decoration:none;font-weight:750}
    code{overflow-wrap:anywhere}@media(max-width:660px){.grid{grid-template-columns:1fr}.top{grid-template-columns:56px 1fr}.icon{width:56px;height:56px}h1{font-size:26px}}
  </style>
</head>
<body>
  <main>
    <section class="top">
      <img class="icon" src="main.png" alt="Voice AI 图标">
      <div>
        <p class="kicker">本机语音助手</p>
        <h1>Voice AI</h1>
        <p class="summary">通过 XiaoZhi 服务器做语音转文字，由本机直连 DeepSeek 生成回复，并可选播报。</p>
      </div>
    </section>
    <div class="grid">
      <section class="panel">
        <h2>功能</h2>
        <ul class="list">
          <li><span class="badge">1</span><span><strong>纯设备端链路</strong><br><span class="muted">不需要电脑端 bridge。</span></span></li>
          <li><span class="badge">2</span><span><strong>自动同步配置</strong><br><span class="muted">优先读取 XiaoZhi 与 Lua Claw 的 API 配置。</span></span></li>
          <li><span class="badge">3</span><span><strong>常连与播报</strong><br><span class="muted">启动后保持小智连接，DeepSeek 回复可尝试转语音。</span></span></li>
        </ul>
      </section>
      <section class="panel">
        <h2>配置入口</h2>
        <p class="muted">启动 Voice AI 后打开：</p>
        <p><code>/voice_ai/</code></p>
        <a class="button" href="/voice_ai/">打开 API 配置页</a>
      </section>
    </div>
  </main>
</body>
</html>
